      <use href="#c" transform="translate(0 10)" stroke="#111111" stroke-width="28"/><use href="#c" transform="translate(0 10)" stroke="#ECEDE7" stroke-width="25.4"/>
      <use href="#c" transform="translate(0 5)" stroke="#111111" stroke-width="28"/><use href="#c" transform="translate(0 5)" stroke="#ECEDE7" stroke-width="25.4"/>
