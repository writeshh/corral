name: Tools

# Builds the Laravel installer as one phar with Box and publishes it to the "tools" release.
# Corral.app bundles the newest phar (scripts/fetch-tools.sh), and Settings > Tools updates it
# from the same release. The app checks the SHA-256 in manifest.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # every Monday, to pick up new installer releases

permissions:
  contents: write

jobs:
  laravel-installer:
    runs-on: ubuntu-latest # has PHP with the phar extension. A phar does not depend on the platform.
    steps:
      # The schedule builds only a new installer release. A manual run always builds.
      # Each upload replaces the phar and the manifest one after the other, so fewer uploads also mean
      # fewer moments where a download gets a phar that does not match the manifest.
      - name: Check for a new installer release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          latest=$(gh api repos/laravel/installer/releases/latest --jq '.tag_name | ltrimstr("v")')
          published=$(gh release download tools --pattern manifest.json --output - 2>/dev/null | jq -r '.laravel.version // empty' || true)
          echo "Latest $latest, published ${published:-none}"
          if [ "$EVENT" = schedule ] && [ "$latest" = "$published" ]; then
            echo "Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'

      - name: Build the phar
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-laravel-installer.sh "${{ steps.check.outputs.version }}"

      - name: Upload to the tools release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tools >/dev/null 2>&1 || \
            gh release create tools --title "Tools" --notes "Command line tools for Corral. Built by .github/workflows/tools.yml."
          gh release upload tools .deps/laravel-dist/laravel.phar .deps/laravel-dist/manifest.json --clobber
