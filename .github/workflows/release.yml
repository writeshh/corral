name: Release

# Builds Corral.app when you push a tag such as v0.4.0, and publishes Corral.zip as a GitHub release.
# The app reads this release to update itself. The tag must match the version in bundle.sh.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26 # Apple silicon. Swift 6.1 on macos-15 crashes while it compiles Corral.
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(grep CFBundleShortVersionString bundle.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "bundle.sh has $version, the tag is $GITHUB_REF_NAME"; exit 1; }

      - run: ./bundle.sh

      - run: ditto -c -k --keepParent Corral.app Corral.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the section of CHANGELOG.md for this version.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" Corral.zip --title "Corral ${GITHUB_REF_NAME#v}" --notes-file notes.md
