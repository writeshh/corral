name: Retry failed builds

# Runs the failed jobs of "PHP builds" and "Tools" one more time. Most failures are temporary:
# no free macOS runner, or a download that timed out. A second failure stays failed.

on:
  workflow_run:
    workflows: ["PHP builds", "Tools"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed
